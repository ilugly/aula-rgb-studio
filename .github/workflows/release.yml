name: Build and publish release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v1.8.0)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: .\build.bat
        shell: cmd
      - name: Smoke test Windows app
        run: |
          Start-Process -FilePath .\dist\AULA-RGB-Studio.exe -ArgumentList '--background' -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) {
            try { $status = Invoke-RestMethod http://127.0.0.1:8777/api/status -TimeoutSec 1 } catch {}
            if ($status.ok) { break }
            Start-Sleep -Seconds 1
          }
          if ($status.platform -ne 'windows') { throw 'Windows app failed to start' }
          Invoke-RestMethod http://127.0.0.1:8777/api/quit -Method Post -Body '{}' -ContentType 'application/json'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/AULA-RGB-Studio.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Build macOS app
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -c 'from aula_hid_mac import use_shared_access; use_shared_access()'
          python -m PyInstaller --noconfirm --clean AULA-RGB-Studio-macOS.spec
          codesign --verify --deep --strict "dist/AULA RGB Studio.app"
      - name: Smoke test macOS app
        run: |
          "dist/AULA RGB Studio.app/Contents/MacOS/AULA-RGB-Studio" --background &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8777/api/status -o status.json; then break; fi
            sleep 1
          done
          python -c 'import json; s=json.load(open("status.json")); assert s["ok"] and s["platform"] == "macos"'
          curl -fsS -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8777/api/quit
      - name: Archive app
        run: ditto -c -k --keepParent "dist/AULA RGB Studio.app" "dist/AULA-RGB-Studio-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/AULA-RGB-Studio-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    if: startsWith(inputs.tag || github.ref_name, 'v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --notes-from-tag --title "AULA RGB Studio $RELEASE_TAG"
